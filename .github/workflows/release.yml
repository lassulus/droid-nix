name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    # The APK embeds the bootstrap, whose static nix and launcher are
    # cross-compiled from x86_64-linux, see bootstrap/.
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space for the cross toolchain
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build unsigned APK (with the bootstrap zip)
        run: nix build .#droid-nix-app -L
      - name: Determine version
        id: version
        run: |
          version="$(nix eval --raw .#droid-nix-app.version)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign APK
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
          SIGN_KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export SIGN_KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$SIGN_KEYSTORE"' EXIT
          base64 -d <<<"$SIGN_KEYSTORE_B64" > "$SIGN_KEYSTORE"
          nix run .#sign -- result/droid-nix-unsigned-aligned.apk "droid-nix-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: droid-nix-*.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: droid-nix-*.apk
          fail_on_unmatched_files: true
