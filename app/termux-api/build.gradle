plugins {
    id "com.android.library"
}

// Its components and permissions are in the app's manifest.
android {
    namespace "com.termux.api"
    compileSdk project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        minSdk project.properties.minSdkVersion.toInteger()
    }

    sourceSets.main.manifest.srcFile "AndroidManifest.xml"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(":termux-shared-compat")
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation "androidx.media:media:1.7.0"
}
